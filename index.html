<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>রোজকার ডোজ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="রোজকার ডোজ">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=hind-siliguri:400,500,600,700|inter:400,500,600,700" rel="stylesheet">
<style>
:root{
  --bg:#080c18;--panel:#0f1526;--panel2:#131b30;--card:#111a2e;--card-h:#16203a;
  --line:#1f2b47;--line2:#2a3860;--tx:#eaf0ff;--tx2:#9db0d8;--tx3:#6d80a8;
  --a1:#6d8cff;--a2:#37e0d6;--a3:#a78bfa;--ok:#34d399;--warn:#fbbf24;
  --r:20px;--font:'Hind Siliguri',system-ui,-apple-system,sans-serif;--mono:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--font);line-height:1.7;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 12% -8%,rgba(109,140,255,.20),transparent 62%),
             radial-gradient(800px 500px at 108% 4%,rgba(55,224,214,.14),transparent 58%),
             radial-gradient(700px 500px at 50% 108%,rgba(167,139,250,.12),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 48px)}
/* header */
.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(135deg,var(--a1),var(--a3));box-shadow:0 8px 24px -8px rgba(109,140,255,.7)}
.logo svg{width:25px;height:25px}
.btitle h1{font-size:21px;font-weight:700;line-height:1.15;letter-spacing:.1px}
.btitle p{font-size:12.5px;color:var(--tx2);font-family:var(--mono);letter-spacing:.3px}
.ring{width:52px;height:52px;flex:0 0 auto;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--a2)}
/* toolbar */
.bar{display:flex;gap:9px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font);font-size:13.5px;font-weight:500;
  color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px 15px;cursor:pointer;transition:.18s}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--line2);background:var(--panel2)}
.btn:active{transform:scale(.97)}
.btn.solid{background:linear-gradient(135deg,var(--a1),var(--a3));border:none;color:#fff;font-weight:600;box-shadow:0 8px 22px -10px rgba(109,140,255,.85)}
.spin{animation:sp .8s linear}
@keyframes sp{to{transform:rotate(360deg)}}
.stamp{font-size:12px;color:var(--tx3);font-family:var(--mono);margin-left:auto}
/* feed */
.feed{display:flex;flex-direction:column;gap:13px}
.card{background:linear-gradient(180deg,var(--card),#0e1729);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 16px 15px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .25s,background .2s}
.card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);opacity:.9;transition:.2s}
.card:hover{border-color:var(--line2);background:var(--card-h)}
.card.open{border-color:var(--acc);box-shadow:0 14px 40px -20px var(--acc)}
.card.open::after{width:4px}
.chead{display:flex;gap:13px;align-items:flex-start}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
  background:color-mix(in srgb,var(--acc) 16%,transparent);border:1px solid color-mix(in srgb,var(--acc) 38%,transparent)}
.ico svg{width:21px;height:21px;stroke:var(--acc);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ctxt{flex:1;min-width:0}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  color:var(--acc);margin-bottom:5px}
.tag .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.ctitle{font-size:15.7px;font-weight:600;line-height:1.4;letter-spacing:.1px}
.cteaser{font-size:13.6px;color:var(--tx2);margin-top:3px}
.chev{width:20px;height:20px;flex:0 0 auto;margin-top:2px;stroke:var(--tx3);stroke-width:2;fill:none;transition:.25s}
.card.open .chev{transform:rotate(180deg);stroke:var(--acc)}
.body{max-height:0;overflow:hidden;transition:max-height .34s cubic-bezier(.4,0,.2,1)}
.card.open .body{max-height:1200px}
.bwrap{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.bwrap p{font-size:14px;color:#cdd8f2;margin-bottom:9px}
.bwrap p:last-child{margin-bottom:0}
.bwrap b{color:#fff;font-weight:600}
.bwrap ul{list-style:none;margin:4px 0 9px}
.bwrap li{position:relative;padding-left:19px;font-size:13.9px;color:#c6d2ee;margin-bottom:6px;line-height:1.62}
.bwrap li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:2px;background:var(--acc);opacity:.85}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--tx2);
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.pill svg{width:12px;height:12px;stroke:var(--tx3);fill:none;stroke-width:1.8}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12.6px;color:var(--a2);text-decoration:none;margin-top:10px;
  font-family:var(--mono);border-bottom:1px dashed color-mix(in srgb,var(--a2) 45%,transparent);padding-bottom:1px}
.src svg{width:13px;height:13px;stroke:var(--a2);fill:none;stroke-width:2}
footer{margin-top:28px;text-align:center;font-size:12px;color:var(--tx3);line-height:1.8}
.fdot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--line2);margin:0 7px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--panel2);border:1px solid var(--line2);color:var(--tx);font-size:13px;padding:11px 18px;border-radius:13px;
  box-shadow:0 16px 40px -16px #000;transition:.3s;z-index:50;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8"/><path d="M2 7h20v5H2z"/>
          <path d="M12 7v14"/><path d="M12 7S10.5 2 8 2a2.5 2.5 0 0 0 0 5"/><path d="M12 7s1.5-5 4-5a2.5 2.5 0 0 1 0 5"/>
        </svg>
      </div>
      <div class="btitle">
        <h1>রোজকার ডোজ</h1>
        <p id="greet">—</p>
      </div>
    </div>
    <div class="ring" title="পড়া হয়েছে">
      <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="#1f2b47" stroke-width="4"/>
      <circle id="ringArc" cx="22" cy="22" r="18" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="113"/></svg>
      <b id="ringTxt">0</b>
      <svg width="0" height="0"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d8cff"/><stop offset="1" stop-color="#37e0d6"/></linearGradient></defs></svg>
    </div>
  </div>

  <div class="bar">
    <button class="btn solid" id="reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>নতুন করে</button>
    <button class="btn" id="collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h16"/><path d="M4 18h16"/><path d="M4 10h16"/><path d="M4 6h16"/></svg>সব বন্ধ</button>
    <span class="stamp" id="stamp"></span>
  </div>

  <div class="feed" id="feed"></div>

  <footer>
    রোজ সকাল ৮টায় (ঢাকা) নিজে থেকে নতুন ডোজ আসে<br>
    <span class="fdot"></span>খবর ও টুল আসে WebBrain দিয়ে<span class="fdot"></span>কার্ডে ট্যাপ করলে বিস্তারিত
  </footer>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
